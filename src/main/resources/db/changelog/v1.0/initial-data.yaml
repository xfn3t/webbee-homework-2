databaseChangeLog:
    - changeSet:
          id: load-initial-data
          author: dev
          changes:
              - loadData:
                    tableName: country
                    file: data/country.csv
                    relativeToChangelogFile: true
                    separator: ";"
                    commentLineStartsWith: "#"
                    quotchar: '"'
                    header: true
                    usePreparedStatement: false
                    encoding: "UTF-8"
                    columns:
                        - column:
                              header: id
                              name: id
                              type: STRING
                        - column:
                              header: name
                              name: name
                              type: STRING

              - loadData:
                    tableName: industry
                    file: data/industry.csv
                    relativeToChangelogFile: true
                    separator: ";"
                    commentLineStartsWith: "#"
                    quotchar: '"'
                    header: true
                    usePreparedStatement: false
                    encoding: "UTF-8"
                    columns:
                        - column:
                              header: id
                              name: id
                              type: NUMERIC
                        - column:
                              header: name
                              name: name
                              type: STRING

              - loadData:
                    tableName: org_form
                    file: data/org_form.csv
                    relativeToChangelogFile: true
                    separator: ";"
                    commentLineStartsWith: "#"
                    quotchar: '"'
                    header: true
                    usePreparedStatement: false
                    encoding: "UTF-8"
                    columns:
                        - column:
                              header: id
                              name: id
                              type: NUMERIC
                        - column:
                              header: name
                              name: name
                              type: STRING

              - sql:
                    sql: UPDATE country   SET is_active = true;
              - sql:
                    sql: UPDATE industry  SET is_active = true;
              - sql:
                    sql: UPDATE org_form  SET is_active = true;

    - changeSet:
            id: reseed-industry-and-orgform
            author: dev
            runOnChange: true
            dbms: postgresql
            changes:
                  - sql:
                          sql: >
                                SELECT setval(
                                  pg_get_serial_sequence('industry','id'),
                                  (SELECT COALESCE(MAX(id),0) FROM industry)
                                );
                  - sql:
                          sql: >
                                SELECT setval(
                                  pg_get_serial_sequence('org_form','id'),
                                  (SELECT COALESCE(MAX(id),0) FROM org_form)
                                );      
